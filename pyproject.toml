[project]
name = "bank-fraud-scoring"
version = "1.0.0"
description = "Real-time card transaction fraud scoring service (portfolio project)"
requires-python = ">=3.9"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["uat: user acceptance scenarios written in business language"]
# numpy 2.x + Apple Accelerate emits spurious matmul FP warnings from sklearn (numpy#26669).
filterwarnings = ["ignore::RuntimeWarning:sklearn.*"]

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "UP006", "UP007", "UP035", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"tests/load/*" = ["S"]
